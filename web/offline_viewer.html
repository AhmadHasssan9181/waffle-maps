<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Pakistan Vector — fully local</title>
<link href="assets/maplibre-gl.css" rel="stylesheet" />
<script src="assets/maplibre-gl.js?v=4"></script>
<style>html, body, #map { height: 100%; margin: 0; }</style>
</head>
<body>
<div id="map"></div>
<script>
  const cb = Date.now();
  const poiFilter = (min, max) => ["all", ["==", "$type", "Point"], [">=", "rank", min], ["<=", "rank", max],
    ["any", ["!has", "level"], ["==", "level", 0]]];
  const poiLayer = (id, minrank, maxrank, minzoom) => ({
    id, type: "symbol", source: "v", "source-layer": "poi", minzoom,
    filter: poiFilter(minrank, maxrank),
    layout: {
      "icon-image": "{class}_11", "icon-size": 1, "text-anchor": "top",
      "text-field": ["coalesce", ["get", "name:en"], ["get", "name"], ["get", "name:latin"]],
      "text-font": ["Noto Sans Regular"], "text-max-width": 9, "text-offset": [0, 1.1],
      "text-padding": 2, "text-size": 11, "icon-allow-overlap": false, "text-optional": true
    },
    paint: { "text-color": "#555", "text-halo-color": "#ffffff", "text-halo-width": 1 }
  });

  maplibregl.setRTLTextPlugin("assets/mapbox-gl-rtl-text.js", false);
  const map = new maplibregl.Map({
    container: "map", center: [73.06, 33.60], zoom: 15, hash: true,
    style: {
      version: 8,
      sprite: "assets/sprite/sprite",
      glyphs: "assets/fonts/{fontstack}/{range}.pbf",
      sources: {
        v: { type: "vector", tiles: [`http://localhost:8080/pakistan_vector/{z}/{x}/{y}.mvt?cb=${cb}`], minzoom: 0, maxzoom: 14 }
      },
      layers: [
        { id: "bg", type: "background", paint: { "background-color": "#f2efe9" } },
        { id: "water", type: "fill", source: "v", "source-layer": "water", paint: { "fill-color": "#a5c8e1" } },
        { id: "landuse", type: "fill", source: "v", "source-layer": "landuse", paint: { "fill-color": "#e8e0d8", "fill-opacity": 0.5 } },
        { id: "park", type: "fill", source: "v", "source-layer": "park", paint: { "fill-color": "#cfe3c8", "fill-opacity": 0.75 } },
        { id: "building", type: "fill", source: "v", "source-layer": "building", minzoom: 13, paint: { "fill-color": "#d9d0c9", "fill-outline-color": "#b8aca3" } },
        { id: "roads", type: "line", source: "v", "source-layer": "transportation", paint: { "line-color": "#ffffff", "line-width": 1.5 } },
        poiLayer("poi-1", 1, 14, 14),
        poiLayer("poi-2", 15, 24, 15),
        poiLayer("poi-3", 25, 999, 16),
        { id: "road-label", type: "symbol", source: "v", "source-layer": "transportation_name", minzoom: 12,
          layout: { "text-field": ["coalesce", ["get", "name:en"], ["get", "name"]], "text-font": ["Noto Sans Regular"], "text-size": 11, "symbol-placement": "line" },
          paint: { "text-color": "#555", "text-halo-color": "#fff", "text-halo-width": 1 } },
        { id: "place", type: "symbol", source: "v", "source-layer": "place",
          layout: { "text-field": ["coalesce", ["get", "name:en"], ["get", "name"]], "text-font": ["Noto Sans Medium"], "text-size": 14 },
          paint: { "text-color": "#222", "text-halo-color": "#fff", "text-halo-width": 1.5 } }
      ]
    }
  });
  map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }));
  window.map = map;
</script>
</body>
</html>
