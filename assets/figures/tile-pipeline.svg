<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="100%">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="55%" stop-color="#FAF4E8"/>
      <stop offset="100%" stop-color="#F2E6CE"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#78350F" opacity="0.08"/>
    </pattern>
    <filter id="card-shadow" x="-5%" y="-5%" width="112%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; }
      .sans { font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; font-weight: 700; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="410" rx="16" fill="url(#bg-grad)"/>
  <rect width="1200" height="410" rx="16" fill="url(#dots)"/>

  <!-- Header Strip -->
  <g transform="translate(44, 34)">
    <rect x="0" y="0" width="162" height="26" rx="6" fill="#F59E0B" fill-opacity="0.18" stroke="#B45309" stroke-width="1.6"/>
    <circle cx="14" cy="13" r="4" fill="#D97706"/>
    <text x="26" y="17" class="mono" font-size="11" letter-spacing="1.2" fill="#92400E">FIG 01 // PIPELINE</text>
    <text x="180" y="18" class="title" font-size="19" fill="#0F172A">End-to-End Offline Vector Cartography &amp; Search Build Pipeline</text>
    <text x="1112" y="17" text-anchor="end" class="mono" font-size="11" fill="#78350F" opacity="0.8">596 MB TOTAL BUNDLE</text>
  </g>

  <!-- Connector Arrows Behind Cards -->
  <g stroke="#0F172A" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 380 218 L 434 218" stroke-dasharray="6 5"/>
    <polygon points="434,212 446,218 434,224" fill="#0F172A" stroke="none"/>
    <path d="M 756 218 L 810 218" stroke-dasharray="6 5"/>
    <polygon points="810,212 822,218 810,224" fill="#0F172A" stroke="none"/>
  </g>

  <!-- STAGE 1: UPSTREAM OPEN DATA -->
  <g transform="translate(44, 84)" filter="url(#card-shadow)">
    <rect width="336" height="282" rx="14" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
    <rect x="0" y="0" width="336" height="44" rx="14" fill="#0F172A"/>
    <rect x="0" y="24" width="336" height="20" fill="#0F172A"/>
    <circle cx="22" cy="22" r="5" fill="#38BDF8"/>
    <text x="36" y="27" class="mono" font-size="12" letter-spacing="1" fill="#F8FAFC">01 · OPEN DATA SOURCES</text>
    <text x="316" y="27" text-anchor="end" class="mono" font-size="11" fill="#38BDF8">RAW INPUT</text>

    <g transform="translate(22, 66)">
      <rect x="0" y="0" width="292" height="58" rx="9" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.8"/>
      <text x="16" y="24" class="title" font-size="14" fill="#0F172A">Geofabrik Pakistan OSM PBF</text>
      <text x="16" y="44" class="mono" font-size="11" fill="#0369A1">Roads · Buildings · Places · Landuse (158 MB)</text>

      <rect x="0" y="72" width="292" height="58" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/>
      <text x="16" y="96" class="title" font-size="14" fill="#0F172A">Overture Maps Places Parquet</text>
      <text x="16" y="116" class="mono" font-size="11" fill="#B45309">16 S3 Shards · Conf &gt;= 0.5 · 809,824 POIs</text>

      <rect x="0" y="144" width="292" height="54" rx="9" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.8"/>
      <text x="16" y="167" class="title" font-size="14" fill="#0F172A">Natural Earth 10m + Noto Sans</text>
      <text x="16" y="186" class="mono" font-size="11" fill="#475569">EPSG:3857 Water Polygons · 256 Glyph Ranges</text>
    </g>
  </g>

  <!-- STAGE 2: COMPILERS & INDEXERS -->
  <g transform="translate(446, 84)" filter="url(#card-shadow)">
    <rect width="310" height="282" rx="14" fill="#FFFBEB" stroke="#B45309" stroke-width="2.5"/>
    <rect x="0" y="0" width="310" height="44" rx="14" fill="#B45309"/>
    <rect x="0" y="24" width="310" height="20" fill="#B45309"/>
    <circle cx="22" cy="22" r="5" fill="#FDE047"/>
    <text x="36" y="27" class="mono" font-size="12" letter-spacing="1" fill="#FFFBEB">02 · TILE &amp; FTS COMPILERS</text>
    <text x="290" y="27" text-anchor="end" class="mono" font-size="11" fill="#FDE047">BUILD</text>

    <g transform="translate(20, 66)">
      <rect x="0" y="0" width="270" height="62" rx="9" fill="#FFFFFF" stroke="#D97706" stroke-width="1.8"/>
      <text x="14" y="23" class="title" font-size="13.5" fill="#0F172A">Planetiler 0.10.2 (OpenMapTiles)</text>
      <text x="14" y="41" class="sans" font-size="11.5" fill="#78350F">Compiles 15 vector layers at z0–z14</text>
      <text x="14" y="55" class="mono" font-size="10.5" fill="#B45309">253,618 MVT/gzip tiles · Clustered PMTiles</text>

      <rect x="0" y="76" width="270" height="62" rx="9" fill="#FFFFFF" stroke="#D97706" stroke-width="1.8"/>
      <text x="14" y="99" class="title" font-size="13.5" fill="#0F172A">DuckDB Spatial ST_AsMVT</text>
      <text x="14" y="117" class="sans" font-size="11.5" fill="#78350F">Projects 809k POIs into z11–z14 tiles</text>
      <text x="14" y="131" class="mono" font-size="10.5" fill="#B45309">119,921 tiles · TMS y-flip → PMTiles</text>

      <rect x="0" y="152" width="270" height="46" rx="9" fill="#FEF3C7" stroke="#92400E" stroke-width="1.8"/>
      <text x="135" y="173" text-anchor="middle" class="mono" font-size="11.5" fill="#92400E">SQLite FTS5 + Style Generator</text>
      <text x="135" y="190" text-anchor="middle" class="sans" font-size="11" fill="#78350F">unicode61 prefix index + 9 style variants</text>
    </g>
  </g>

  <!-- STAGE 3: ON-DEVICE RUNTIME ARTIFACTS -->
  <g transform="translate(822, 84)" filter="url(#card-shadow)">
    <rect width="334" height="282" rx="14" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
    <rect x="0" y="0" width="334" height="44" rx="14" fill="#0D9488"/>
    <rect x="0" y="24" width="334" height="20" fill="#0D9488"/>
    <circle cx="22" cy="22" r="5" fill="#CCFBF1"/>
    <text x="36" y="27" class="mono" font-size="12" letter-spacing="1" fill="#F0FDFA">03 · SHIPPED PACKAGES</text>
    <text x="314" y="27" text-anchor="end" class="mono" font-size="11" fill="#CCFBF1">ON-DEVICE</text>

    <g transform="translate(22, 66)">
      <rect x="0" y="0" width="290" height="58" rx="9" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.8"/>
      <text x="16" y="24" class="title" font-size="14" fill="#0F172A">pakistan_vector.pmtiles</text>
      <text x="16" y="44" class="mono" font-size="11" fill="#0F766E">266.1 MB · z0–z14 Basemap + Overzoom</text>

      <rect x="0" y="72" width="290" height="58" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/>
      <text x="16" y="96" class="title" font-size="14" fill="#0F172A">pakistan_places.pmtiles</text>
      <text x="16" y="116" class="mono" font-size="11" fill="#B45309">214.5 MB · z11–z14 · Layer: place</text>

      <rect x="0" y="144" width="290" height="54" rx="9" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.8"/>
      <text x="16" y="167" class="title" font-size="14" fill="#0F172A">places_search.db + app-assets/</text>
      <text x="16" y="186" class="mono" font-size="11" fill="#334155">104.4 MB FTS5 DB · 11 MB Fonts &amp; Sprites</text>
    </g>
  </g>

  <!-- Outer Frame -->
  <rect x="3" y="3" width="1194" height="404" rx="14" fill="none" stroke="#0F172A" stroke-width="4"/>
</svg>

