<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="100%">
  <defs>
    <radialGradient id="rt-bg" cx="50%" cy="35%" r="85%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="55%" stop-color="#FAF4E8"/>
      <stop offset="100%" stop-color="#F2E6CE"/>
    </radialGradient>
    <pattern id="rt-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#78350F" opacity="0.08"/>
    </pattern>
    <filter id="rt-shadow" x="-5%" y="-5%" width="112%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; }
      .sans { font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; font-weight: 700; }
    </style>
  </defs>

  <rect width="1200" height="450" rx="16" fill="url(#rt-bg)"/>
  <rect width="1200" height="450" rx="16" fill="url(#rt-dots)"/>

  <!-- Header -->
  <g transform="translate(44, 34)">
    <rect x="0" y="0" width="184" height="26" rx="6" fill="#F59E0B" fill-opacity="0.18" stroke="#B45309" stroke-width="1.6"/>
    <circle cx="14" cy="13" r="4" fill="#D97706"/>
    <text x="26" y="17" class="mono" font-size="11" letter-spacing="1.2" fill="#92400E">FIG 03 // INTEGRATION</text>
    <text x="202" y="18" class="title" font-size="19" fill="#0F172A">Dual-PMTiles Runtime &amp; Offline FTS5 Query Architecture</text>
    <text x="1112" y="17" text-anchor="end" class="mono" font-size="11" fill="#78350F" opacity="0.8">ANDROID NATIVE + WEB GL</text>
  </g>

  <!-- Vertical Connectors -->
  <g stroke="#0F172A" stroke-width="2.5" stroke-dasharray="5 4">
    <line x1="180" y1="164" x2="180" y2="200"/>
    <line x1="460" y1="164" x2="460" y2="200"/>
    <line x1="740" y1="164" x2="740" y2="200"/>
    <line x1="1020" y1="164" x2="1020" y2="200"/>

    <line x1="180" y1="272" x2="180" y2="306"/>
    <line x1="460" y1="272" x2="460" y2="306"/>
    <line x1="740" y1="272" x2="740" y2="306"/>
    <line x1="1020" y1="272" x2="1020" y2="306"/>
  </g>

  <!-- LAYER 1: ON-DISK ARTIFACTS -->
  <g transform="translate(44, 82)" filter="url(#rt-shadow)">
    <g transform="translate(0, 0)">
      <rect width="262" height="82" rx="11" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.2"/>
      <rect x="14" y="14" width="110" height="18" rx="4" fill="#E0F2FE"/>
      <text x="69" y="26" text-anchor="middle" class="mono" font-size="9.5" fill="#0369A1">SOURCE: &quot;v&quot;</text>
      <text x="14" y="50" class="title" font-size="14" fill="#0F172A">pakistan_vector.pmtiles</text>
      <text x="14" y="68" class="mono" font-size="10.5" fill="#475569">pmtiles://file://... (266 MB)</text>
    </g>
    <g transform="translate(283, 0)">
      <rect width="262" height="82" rx="11" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.2"/>
      <rect x="14" y="14" width="124" height="18" rx="4" fill="#FEF3C7"/>
      <text x="76" y="26" text-anchor="middle" class="mono" font-size="9.5" fill="#92400E">SOURCE: &quot;places&quot;</text>
      <text x="14" y="50" class="title" font-size="14" fill="#0F172A">pakistan_places.pmtiles</text>
      <text x="14" y="68" class="mono" font-size="10.5" fill="#475569">pmtiles://file://... (214.5 MB)</text>
    </g>
    <g transform="translate(566, 0)">
      <rect width="262" height="82" rx="11" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.2"/>
      <rect x="14" y="14" width="118" height="18" rx="4" fill="#CCFBF1"/>
      <text x="73" y="26" text-anchor="middle" class="mono" font-size="9.5" fill="#0F766E">ASSET BUNDLE</text>
      <text x="14" y="50" class="title" font-size="14" fill="#0F172A">app-assets/ + styles/</text>
      <text x="14" y="68" class="mono" font-size="10.5" fill="#475569">file:///android_asset/... (11 MB)</text>
    </g>
    <g transform="translate(850, 0)">
      <rect width="262" height="82" rx="11" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.2"/>
      <rect x="14" y="14" width="118" height="18" rx="4" fill="#F1F5F9"/>
      <text x="73" y="26" text-anchor="middle" class="mono" font-size="9.5" fill="#334155">SQLITE FTS5</text>
      <text x="14" y="50" class="title" font-size="14" fill="#0F172A">places_search.db</text>
      <text x="14" y="68" class="mono" font-size="10.5" fill="#475569">809,824 Indexed POIs (104.4 MB)</text>
    </g>
  </g>

  <!-- LAYER 2: RUNTIME STYLE & QUERY RESOLVER -->
  <g transform="translate(44, 200)" filter="url(#rt-shadow)">
    <rect width="1112" height="72" rx="14" fill="#0F172A" stroke="#0F172A" stroke-width="2.5"/>
    <rect x="20" y="18" width="184" height="36" rx="8" fill="#F59E0B"/>
    <text x="112" y="41" text-anchor="middle" class="mono" font-size="12" fill="#0F172A">MapStyleResolver</text>
    <text x="224" y="34" class="title" font-size="16" fill="#F8FAFC">Runtime URI Injection &amp; Dual-Source Vector Style Compiler (MapLibre Native 11.8)</text>
    <text x="224" y="54" class="mono" font-size="11.5" fill="#38BDF8">Rewrites __PMTILES_URL__ · __PLACES_URL__ · __GLYPHS_URL__ · __SPRITE_URL__ at Load Time</text>
  </g>

  <!-- LAYER 3: CONSUMER FEATURES IN W.A.F.F.L.E. -->
  <g transform="translate(44, 306)" filter="url(#rt-shadow)">
    <!-- Feature 1 -->
    <g transform="translate(0, 0)">
      <rect width="262" height="108" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.2"/>
      <rect x="0" y="0" width="262" height="32" rx="12" fill="#0284C7"/>
      <rect x="0" y="16" width="262" height="16" fill="#0284C7"/>
      <text x="16" y="21" class="mono" font-size="11" fill="#F0F9FF">60 FPS VECTOR MAP</text>
      <text x="16" y="55" class="title" font-size="13.5" fill="#0F172A">Zero-Signal Basemap</text>
      <text x="16" y="74" class="sans" font-size="11.5" fill="#475569">15 OpenMapTiles layers with</text>
      <text x="16" y="91" class="mono" font-size="10.5" fill="#0369A1">3D building extrusions &amp; shields</text>
    </g>

    <!-- Feature 2 -->
    <g transform="translate(283, 0)">
      <rect width="262" height="108" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.2"/>
      <rect x="0" y="0" width="262" height="32" rx="12" fill="#D97706"/>
      <rect x="0" y="16" width="262" height="16" fill="#D97706"/>
      <text x="16" y="21" class="mono" font-size="11" fill="#FFFBEB">INTERACTIVE POI LAYER</text>
      <text x="16" y="55" class="title" font-size="13.5" fill="#0F172A">Tap-to-Inspect &amp; Nearest</text>
      <text x="16" y="74" class="sans" font-size="11.5" fill="#475569">queryRenderedFeatures for phone,</text>
      <text x="16" y="91" class="mono" font-size="10.5" fill="#B45309">website, address &amp; category filter</text>
    </g>

    <!-- Feature 3 -->
    <g transform="translate(566, 0)">
      <rect width="262" height="108" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.2"/>
      <rect x="0" y="0" width="262" height="32" rx="12" fill="#0D9488"/>
      <rect x="0" y="16" width="262" height="16" fill="#0D9488"/>
      <text x="16" y="21" class="mono" font-size="11" fill="#F0FDFA">INSTANT OFFLINE SEARCH</text>
      <text x="16" y="55" class="title" font-size="13.5" fill="#0F172A">Prefix &amp; BM25 Ranking</text>
      <text x="16" y="74" class="sans" font-size="11.5" fill="#475569">Sub-5ms FTS5 queries across</text>
      <text x="16" y="91" class="mono" font-size="10.5" fill="#0F766E">809k POIs with zero network</text>
    </g>

    <!-- Feature 4 -->
    <g transform="translate(850, 0)">
      <rect width="262" height="108" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.2"/>
      <rect x="0" y="0" width="262" height="32" rx="12" fill="#334155"/>
      <rect x="0" y="16" width="262" height="16" fill="#334155"/>
      <text x="16" y="21" class="mono" font-size="11" fill="#F8FAFC">3D NAVIGATION HUD</text>
      <text x="16" y="55" class="title" font-size="13.5" fill="#0F172A">GraphHopper Route Target</text>
      <text x="16" y="74" class="sans" font-size="11.5" fill="#475569">Feeds POI coordinates into</text>
      <text x="16" y="91" class="mono" font-size="10.5" fill="#334155">offline turn-by-turn routing</text>
    </g>
  </g>

  <rect x="3" y="3" width="1194" height="444" rx="14" fill="none" stroke="#0F172A" stroke-width="4"/>
</svg>

