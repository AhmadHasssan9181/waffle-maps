<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="100%">
  <defs>
    <radialGradient id="sm-bg" cx="50%" cy="35%" r="85%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="55%" stop-color="#FAF4E8"/>
      <stop offset="100%" stop-color="#F2E6CE"/>
    </radialGradient>
    <pattern id="sm-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#78350F" opacity="0.08"/>
    </pattern>
    <filter id="sm-shadow" x="-5%" y="-5%" width="112%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; }
      .sans { font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; font-weight: 700; }
    </style>
  </defs>

  <rect width="1200" height="430" rx="16" fill="url(#sm-bg)"/>
  <rect width="1200" height="430" rx="16" fill="url(#sm-dots)"/>

  <!-- Header -->
  <g transform="translate(44, 34)">
    <rect x="0" y="0" width="182" height="26" rx="6" fill="#F59E0B" fill-opacity="0.18" stroke="#B45309" stroke-width="1.6"/>
    <circle cx="14" cy="13" r="4" fill="#D97706"/>
    <text x="26" y="17" class="mono" font-size="11" letter-spacing="1.2" fill="#92400E">FIG 02 // CARTOGRAPHY</text>
    <text x="200" y="18" class="title" font-size="19" fill="#0F172A">3&#215;3 Theme &amp; Bilingual Script Matrix (47 MapLibre Layers Each)</text>
    <text x="1112" y="17" text-anchor="end" class="mono" font-size="11" fill="#78350F" opacity="0.8">9 READY-TO-LOAD STYLES</text>
  </g>

  <!-- Left Matrix Card -->
  <g transform="translate(44, 82)" filter="url(#sm-shadow)">
    <rect width="750" height="310" rx="14" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
    <!-- Table Header -->
    <rect x="0" y="0" width="750" height="44" rx="14" fill="#0F172A"/>
    <rect x="0" y="24" width="750" height="20" fill="#0F172A"/>
    <text x="24" y="27" class="mono" font-size="11.5" fill="#F8FAFC">THEME PALETTE</text>
    <text x="250" y="27" class="mono" font-size="11.5" fill="#38BDF8">ENGLISH (EN)</text>
    <text x="425" y="27" class="mono" font-size="11.5" fill="#FBBF24">URDU (name:ur)</text>
    <text x="585" y="27" class="mono" font-size="11.5" fill="#34D399">BILINGUAL (EN + UR)</text>

    <!-- Row 1: Light Theme -->
    <g transform="translate(0, 44)">
      <rect x="2" y="0" width="746" height="88" fill="#FFFDF9"/>
      <line x1="0" y1="88" x2="750" y2="88" stroke="#E2E8F0" stroke-width="1.5"/>
      <!-- Swatch -->
      <rect x="22" y="18" width="44" height="52" rx="8" fill="#F8F4EC" stroke="#0F172A" stroke-width="2"/>
      <path d="M26 52 L62 28" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
      <circle cx="44" cy="40" r="4" fill="#0284C7"/>
      <text x="80" y="38" class="title" font-size="15" fill="#0F172A">Light Cartographic</text>
      <text x="80" y="56" class="sans" font-size="11.5" fill="#475569">Daylight streets, amber highways,</text>
      <text x="80" y="71" class="mono" font-size="10" fill="#B45309">3D buildings &amp; category POI sprites</text>

      <!-- EN Pill -->
      <rect x="246" y="26" width="152" height="36" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.6"/>
      <text x="322" y="48" text-anchor="middle" class="mono" font-size="11" fill="#0F172A">style_light.json</text>

      <!-- UR Pill -->
      <rect x="416" y="26" width="152" height="36" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
      <text x="492" y="48" text-anchor="middle" class="mono" font-size="11" fill="#92400E">style_light_ur.json</text>

      <!-- BOTH Pill -->
      <rect x="582" y="26" width="152" height="36" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
      <text x="658" y="48" text-anchor="middle" class="mono" font-size="10.5" fill="#0F766E">style_light_both.json</text>
    </g>

    <!-- Row 2: Dark Theme -->
    <g transform="translate(0, 132)">
      <rect x="2" y="0" width="746" height="88" fill="#FFFFFF"/>
      <line x1="0" y1="88" x2="750" y2="88" stroke="#E2E8F0" stroke-width="1.5"/>
      <!-- Swatch -->
      <rect x="22" y="18" width="44" height="52" rx="8" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>
      <path d="M26 52 L62 28" stroke="#FBBF24" stroke-width="4" stroke-linecap="round"/>
      <circle cx="44" cy="40" r="4" fill="#38BDF8"/>
      <text x="80" y="38" class="title" font-size="15" fill="#0F172A">Dark Night-Ops</text>
      <text x="80" y="56" class="sans" font-size="11.5" fill="#475569">Low-glare charcoal slate canvas</text>
      <text x="80" y="71" class="mono" font-size="10" fill="#0369A1">tuned for cockpit &amp; night driving</text>

      <!-- EN Pill -->
      <rect x="246" y="26" width="152" height="36" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.6"/>
      <text x="322" y="48" text-anchor="middle" class="mono" font-size="11" fill="#0F172A">style_dark.json</text>

      <!-- UR Pill -->
      <rect x="416" y="26" width="152" height="36" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
      <text x="492" y="48" text-anchor="middle" class="mono" font-size="11" fill="#92400E">style_dark_ur.json</text>

      <!-- BOTH Pill -->
      <rect x="582" y="26" width="152" height="36" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/>
      <text x="658" y="48" text-anchor="middle" class="mono" font-size="10.5" fill="#0F766E">style_dark_both.json</text>
    </g>

    <!-- Row 3: Field Theme -->
    <g transform="translate(0, 220)">
      <rect x="2" y="0" width="746" height="88" rx="12" fill="#FFFBEB"/>
      <!-- Swatch -->
      <rect x="22" y="18" width="44" height="52" rx="8" fill="#090D16" stroke="#B45309" stroke-width="2"/>
      <path d="M26 52 L62 28" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="44" cy="40" r="4" fill="#FDE047"/>
      <text x="80" y="38" class="title" font-size="15" fill="#0F172A">Field Tactical Amber</text>
      <text x="80" y="56" class="sans" font-size="11.5" fill="#78350F">True-black + high-contrast amber</text>
      <text x="80" y="71" class="mono" font-size="10" fill="#B45309">for harsh sunlight &amp; emergency HUD</text>

      <!-- EN Pill -->
      <rect x="246" y="26" width="152" height="36" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.6"/>
      <text x="322" y="48" text-anchor="middle" class="mono" font-size="11" fill="#0F172A">style_field.json</text>

      <!-- UR Pill -->
      <rect x="416" y="26" width="152" height="36" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.8"/>
      <text x="492" y="48" text-anchor="middle" class="mono" font-size="11" fill="#92400E">style_field_ur.json</text>

      <!-- BOTH Pill -->
      <rect x="582" y="26" width="152" height="36" rx="8" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.8"/>
      <text x="658" y="48" text-anchor="middle" class="mono" font-size="10.5" fill="#0F766E">style_field_both.json</text>
    </g>
  </g>

  <!-- Right Side: Layer & Glyph Specs Card -->
  <g transform="translate(816, 82)" filter="url(#sm-shadow)">
    <rect width="340" height="310" rx="14" fill="#FFFBEB" stroke="#B45309" stroke-width="2.5"/>
    <rect x="0" y="0" width="340" height="44" rx="14" fill="#B45309"/>
    <rect x="0" y="24" width="340" height="20" fill="#B45309"/>
    <text x="20" y="27" class="mono" font-size="11.5" fill="#FFFBEB">RENDERING GUARANTEES</text>

    <g transform="translate(20, 62)">
      <rect x="0" y="0" width="300" height="68" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.8"/>
      <text x="16" y="24" class="title" font-size="14" fill="#0F172A">Full 256 Glyph Range Bundle</text>
      <text x="16" y="43" class="sans" font-size="11.5" fill="#78350F">Ships every 0–65535 PBF range for Noto</text>
      <text x="16" y="58" class="mono" font-size="10.5" fill="#B45309">Sans so Urdu/Arabic never drops a tile</text>

      <rect x="0" y="82" width="300" height="68" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.8"/>
      <text x="16" y="106" class="title" font-size="14" fill="#0F172A">z14 Overzoom Architecture</text>
      <text x="16" y="125" class="sans" font-size="11.5" fill="#78350F">Sources cap at maxzoom 14; MapLibre</text>
      <text x="16" y="140" class="mono" font-size="10.5" fill="#B45309">overzooms z15–z22 with zero 404 faults</text>

      <rect x="0" y="164" width="300" height="68" rx="10" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.8"/>
      <text x="16" y="188" class="title" font-size="14" fill="#0F172A">Collision-Tuned POI Density</text>
      <text x="16" y="207" class="sans" font-size="11.5" fill="#334155">809k places filtered by zoom &amp; category</text>
      <text x="16" y="222" class="mono" font-size="10.5" fill="#0F766E">with 1x / 2x high-DPI sprite atlases</text>
    </g>
  </g>

  <rect x="3" y="3" width="1194" height="424" rx="14" fill="none" stroke="#0F172A" stroke-width="4"/>
</svg>
